[build]
  publish = "."

[[redirects]]
  from = "/process-contact.php"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/process-volunteer.php"
  to = "/volunteer.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"